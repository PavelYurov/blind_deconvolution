[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blind_deconvolution"
version = "0.1.0"
authors = [
  { name = "Anton Bezzaborov" },
  { name = "Pavel Yurov" },
  { name = "Yaroslav Malysh" },
  { name = "Konstantin Kuropatov" },
]
description = "Blind Image Deconvolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow",
  "PyWavelets",
  "scikit-image",
  "imageio",
  "tifffile",
  "opencv-python",
  "numpy",
  "scipy",
  "pandas",
  "optuna",
  "matplotlib",
  "oct2py>=5.8.0",
  "pydantic>=2.12.5",
  "pydantic_settings>=2.12.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0.0",
]

[project.optional-dependencies]
full = [
  "scikit-image>=0.19.0",
  "opencv-python>=4.5.0",
  "optuna>=3.0.0",
  "tifffile>=2021.0.0",
  "imageio>=2.15.0",
  "PyWavelets>=1.3.0",
]

cli = [
  "click>=8.0.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0.0",
]

dev = [
  "pytest>=7.0.0",
  "flake8>=6.0.0",
  "ipython>=8.0.0",
]

docs = [
  "sphinx>=5.0.0",
  "sphinx-rtd-theme>=1.0.0",
  "myst-parser>=2.0.0",
]

[project.scripts]
blinddeconv-run = "run:main"
blinddeconv-cli = "cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.preflight]
default-profile = "base"

[tool.preflight.profiles.base]
dependencies = "project.dependencies"

[tool.preflight.profiles.full]
dependencies = "project.optional-dependencies.full"

[tool.preflight.profiles.dev]
dependencies = "project.optional-dependencies.dev"
