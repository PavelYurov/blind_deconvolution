# ============================================================================
# Конфигурация для обработки спутниковых снимков
# ============================================================================
# Спутниковые снимки подвержены атмосферному размытию и шуму датчиков.
# Используются более агрессивные параметры восстановления.
#
# Запуск:
#   python run.py --config configs/satellite_images.yaml
#   python run.py --config configs/satellite_images.yaml --output-dir satellite_results/
# ============================================================================

experiment:
  name: "Satellite Image Restoration"
  description: >
    Восстановление спутниковых снимков с моделированием
    атмосферного размытия и шума сенсоров. Цветные изображения,
    агрессивные параметры деконволюции.

input:
  images_folder: "images/original"
  color: true
  load_mode: "all"

output:
  restored_folder: "results/satellite/restored"
  data_folder: "results/satellite/data"
  kernel_folder: "results/satellite/kernels"

processing:
  mode: "full_process"
  metadata: true
  unique_paths: true

filters:
  # Цепочка 1: атмосферное размытие (гауссово) + шум сенсора
  - chain:
      - type: "defocus_blur"
        params:
          psf: "gaussian"
          param: 4.0
          kernel_size: 25
      - type: "gaussian_noise"
        params:
          param: 8.0

  # Цепочка 2: движение спутника (motion blur) + шум
  - chain:
      - type: "motion_blur"
        params:
          psf: "uniform"
          param: 3.0
          angle: 30
          kernel_length: 15
      - type: "gaussian_noise"
        params:
          param: 5.0

algorithms:
  - name: "vabid"
    params:
      max_iter: 300
      kernel_size: 25

  - name: "richardson_lucy"
    params:
      max_iter: 200
      kernel_size: 25

report:
  generate: true
  format: "latex"
  output_path: "results/satellite/report.tex"
