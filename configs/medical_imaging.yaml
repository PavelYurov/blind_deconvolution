# ============================================================================
# Конфигурация для обработки медицинских изображений
# ============================================================================
# Медицинские изображения обычно монохромные, требуют высокой точности
# восстановления и минимального внесения артефактов.
#
# Запуск:
#   python run.py --config configs/medical_imaging.yaml
#   python run.py --config configs/medical_imaging.yaml --generate-report
# ============================================================================

experiment:
  name: "Medical Imaging Deconvolution"
  description: >
    Восстановление медицинских изображений с использованием
    байесовских и вариационных методов деконволюции.
    Акцент на точности восстановления мелких структур.

input:
  images_folder: "images/original"
  color: false
  load_mode: "all"

output:
  restored_folder: "results/medical/restored"
  data_folder: "results/medical/data"
  kernel_folder: "results/medical/kernels"

processing:
  mode: "full_process"
  metadata: true
  unique_paths: true

# ─── Цепочки фильтров (для full_process) ─────────────────────────────────────
# Каждая цепочка — последовательность фильтров, применяемых к оригиналу.
# Результат каждой цепочки сохраняется как отдельное размытое изображение.
filters:
  # Цепочка 1: слабое гауссово размытие + минимальный шум
  - chain:
      - type: "defocus_blur"
        params:
          psf: "gaussian"
          param: 2.0
      - type: "gaussian_noise"
        params:
          param: 3.0

  # Цепочка 2: умеренное размытие кольцевого типа
  - chain:
      - type: "defocus_blur"
        params:
          psf: "ring"
          param: 3.0
      - type: "gaussian_noise"
        params:
          param: 5.0

algorithms:
  - name: "vabid"
    params:
      max_iter: 200
      kernel_size: 15

  - name: "vbbid_tv"
    params:
      max_iter: 150
      kernel_size: 15

report:
  generate: true
  format: "latex"
  output_path: "results/medical/report.tex"
