# ============================================================================
# LowRank-BD: Конфигурация для комбинированного размытия + шум
# ============================================================================
# Целевой сценарий:
#   MotionBlur(kernel_length=15..25) + DefocusBlur(param=2..5)
#   + опционально GaussianNoise(3..10)
#
#   Примеры из эксперимента:
#     Cell 7: fl_motion2 + fl_defocus            (exec=10)
#     Cell 8: fl_motion2 + fl_defocus + fl_gauss  (exec=8)
#     Cell 9: fl_motion2 + fl_defocus2 + fl_gauss (exec=6)
#
# Почему дефолтные параметры не работают:
#   1. Комбинированное ядро = conv(motion, defocus) — это «размазанный
#      диск» (вытянутый эллипс).  Его ранг выше, чем у чистого motion
#      (ранг 1), но ниже, чем у чистого defocus (полный ранг).
#      → Нужна УМЕРЕННАЯ low-rank регуляризация (не полная, не нулевая).
#   2. Комбинированное размытие сильнее каждого по отдельности →
#      изображение теряет больше информации → нужна более сильная
#      регуляризация (lambda_ ↑) и больше итераций.
#   3. Добавление шума ещё сильнее портит оценку изображения →
#      нужно увеличить thr_e для «сглаживания» IRLS-весов (робастность).
#   4. kernel_size=31 может быть впритык для conv(21, 11) ≈ 31.
#      Нужно меньше обрезать ядро (threshold ↓).
#
# Что изменено и почему:
#   - lambda_ ↑ 8e-3: самая сильная регуляризация (4× default).
#     Комбинированный blur удаляет больше ВЧ → нужно сильнее
#     подавлять шум в оценке изображения.
#   - alpha_multiplier ↓ 1.5: стандартное снижение для лучшего
#     баланса α по масштабам.
#   - exp_a = 0.6: компромисс между sparse (0.5, motion) и
#     moderate (0.8, defocus).
#   - thr_e ↑ 1e-3: увеличенное ε для робастности к шуму.
#     (default 1/1500 ≈ 6.7e-4 → 1e-3).
#     IRLS-веса на плоских участках: (1e-3)^(-0.4) ≈ 63 вместо 81 →
#     чуть меньше регуляризации на плоских участках, но IRLS менее
#     чувствителен к шуму в оценке градиентов.
#   - sigma ↓ 0.5: умеренная low-rank (default 1.0).
#     Комбинированное ядро — не ранг-1, нельзя слишком давить.
#   - lambda_s = null (auto): RPCA автоматически подбирает λ.
#     Комбинированное ядро — не ранг-1, умеренная разреженность.
#   - max_iter ↑ 15: максимум итераций для самого сложного случая.
#   - max_irls ↑ 4: больше IRLS итераций → более точные веса.
#   - max_cg ↑ 300: больше CG для более точного решения.
#   - iter_k_rank ↑ 7: максимум уточнений ядра.
#   - nb_lambda ↑ 5000: при шуме non-blind этап тоже нуждается
#     в более сильной регуляризации.
# ============================================================================

experiment:
  name: "LowRank-BD: Combined Blur + Noise"
  description: >
    Восстановление изображений с комбинированным размытием
    (движение + расфокус) и аддитивным шумом. Наиболее сложный
    сценарий — усиленная регуляризация на всех этапах.

input:
  images_folder: "images/original"
  color: false
  load_mode: "all"

output:
  restored_folder: "results/lowrank_combined/restored"
  data_folder: "results/lowrank_combined/data"
  kernel_folder: "results/lowrank_combined/kernels"

processing:
  mode: "full_process"
  metadata: true
  unique_paths: true

filters:
  # Цепочка 1: motion + defocus (без шума)
  - chain:
      - type: "motion_blur"
        params:
          psf: "gaussian"
          param: 150.0
          angle: 120
          kernel_length: 21
      - type: "defocus_blur"
        params:
          psf: "gaussian"
          param: 2

  # Цепочка 2: motion + defocus + Gaussian noise
  - chain:
      - type: "motion_blur"
        params:
          psf: "gaussian"
          param: 150.0
          angle: 120
          kernel_length: 21
      - type: "defocus_blur"
        params:
          psf: "gaussian"
          param: 2
      - type: "gaussian_noise"
        params:
          param: 5.0

algorithms:
  - name: "lowrank_bd"
    params:
      kernel_size: 31
      # ─── Регуляризация изображения ─────────────────────────────
      lambda_: 0.008          # ↑ 4×    (default: 2e-3)
      alpha_multiplier: 1.5   # ↓       (default: 2.0)
      exp_a: 0.6              # ↓ компромисс (default: 0.8)
      thr_e: 0.001            # ↑ 1.5×  (default: 6.7e-4) — робастность к шуму
      # ─── Регуляризация ядра ────────────────────────────────────
      kernel_beta: 0.003      #   default
      sigma: 0.5              # ↓       (default: 1.0) — умеренная low-rank
      lambda_s: null          #   auto — RPCA sparse weight
      p_sparse: 0.5           #   default — Lp exponent
      rho_alm: 6.0            #   default — ALM penalty growth
      threshold: 0.02         # ↓       (default: 0.05)
      # ─── Итерации ─────────────────────────────────────────────
      max_iter: 15            # ↑ 2×    (default: 7)
      max_irls: 4             # ↑       (default: 3)
      max_cg: 300             # ↑ 1.5×  (default: 200)
      max_iter_k: 50          #   default
      max_iter_rank: 30       # ↑       (default: 30) — iALM iterations
      iter_k_rank: 7          # ↑ 2.3×  (default: 3)
      # ─── Non-blind деконволюция ────────────────────────────────
      nb_lambda: 5000.0       # ↑ 1.7×  (default: 3000) — подавление шума
      nb_alpha: 0.5           #   default

report:
  generate: true
  format: "latex"
  output_path: "results/lowrank_combined/report.tex"
