# ============================================================================
# LowRank-BD: Конфигурация для сильного линейного смаза движения
# ============================================================================
# Целевой сценарий:
#   MotionBlur(kernel_length=15..25, param=100..200, любой angle)
#   Пример: fl_motion2 = MotionBlur(gaussian_distribution, param=150, angle=120, kernel_length=21)
#
# Почему дефолтные параметры не работают:
#   1. lambda_ = 2e-3 даёт α ≈ 1.4e-3 на тонком масштабе — слишком
#      слабая регуляризация для сильно смазанного изображения.
#      Оценка изображения получается слишком шумной → ядро не сходится.
#   2. alpha_multiplier = 2.0 создаёт экспоненциально большие α на
#      грубых масштабах (α ≈ 0.18 при 8 масштабах), что чрезмерно
#      сглаживает изображение и убивает полезные рёбра для оценки ядра.
#   3. max_iter = 7 недостаточно для сходимости чередующейся
#      минимизации при 31×31 ядре (961 неизвестных).
#   4. iter_k_rank = 3 → всего 21 обновление ядра за масштаб.
#
# Что изменено и почему:
#   - lambda_ ↑ 5e-3: усиливает edge-prior → более чистые рёбра
#     в оценке изображения → точнее оценка ядра.
#     На тонком масштабе: α ≈ 4.1e-3 (вместо 1.4e-3).
#   - alpha_multiplier ↓ 1.5: α на грубом масштабе = 0.074 (вместо 0.181).
#     Менее агрессивное сглаживание → больше информации о рёбрах.
#   - exp_a ↓ 0.5: sparser hyper-Laplacian prior.
#     Для motion blur рёбра резкие и разреженные → p=0.5 лучше
#     сохраняет их, чем p=0.8.
#   - max_iter ↑ 12: больше итераций для сходимости.
#   - iter_k_rank ↑ 5: больше чередований ядро/ранг за итерацию.
#   - tau ↑ 5e-5: motion kernel по природе low-rank (ранг 1–2),
#     более сильная ядерная норма помогает подавить шум в ядре.
#   - kernel_beta ↓ 2e-3: меньше якорения к предыдущему ядру →
#     позволяет ядру быстрее меняться на каждом шаге CG.
#   - threshold ↓ 0.03: менее агрессивное обнуление элементов ядра,
#     чтобы тонкие линии motion blur не обрезались преждевременно.
# ============================================================================

experiment:
  name: "LowRank-BD: Large Motion Blur"
  description: >
    Восстановление изображений с сильным линейным смазом движения
    (kernel_length 15–25 пикселей). Параметры оптимизированы для
    разреженных motion-ядер с использованием усиленной low-rank
    регуляризации и более разреженного градиентного prior.

input:
  images_folder: "images/original"
  color: false
  load_mode: "all"

output:
  restored_folder: "results/lowrank_motion/restored"
  data_folder: "results/lowrank_motion/data"
  kernel_folder: "results/lowrank_motion/kernels"

processing:
  mode: "full_process"
  metadata: true
  unique_paths: true

filters:
  - chain:
      - type: "motion_blur"
        params:
          psf: "gaussian"
          param: 150.0
          angle: 120
          kernel_length: 21

algorithms:
  - name: "lowrank_bd"
    params:
      kernel_size: 31
      # ─── Регуляризация изображения ─────────────────────────────
      lambda_: 0.005          # ↑ 2.5×  (default: 2e-3)
      alpha_multiplier: 1.5   # ↓       (default: 2.0)
      exp_a: 0.5              # ↓ sparser prior (default: 0.8)
      thr_e: 0.000667         #   default (1/1500)
      # ─── Регуляризация ядра ────────────────────────────────────
      kernel_beta: 0.002      # ↓       (default: 3e-3)
      sigma: 1.0              #   default (low-rank ON)
      tau: 0.00005            # ↑ 5×    (default: 1e-5)
      delta: 0.00001          #   default
      threshold: 0.03         # ↓       (default: 0.05)
      # ─── Итерации ─────────────────────────────────────────────
      max_iter: 12            # ↑ 1.7×  (default: 7)
      max_irls: 3             #   default
      max_cg: 200             #   default
      max_iter_k: 50          #   default
      max_iter_rank: 5        # ↑       (default: 3)
      iter_k_rank: 5          # ↑ 1.7×  (default: 3)
      # ─── Non-blind деконволюция ────────────────────────────────
      nb_lambda: 3000.0       #   default
      nb_alpha: 0.5           #   default

report:
  generate: true
  format: "latex"
  output_path: "results/lowrank_motion/report.tex"
